# Minimal packaging so `pip install -e .` makes `import agent` work from anywhere
# (the code lives in src/agent/). Dependencies stay in requirements.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analyst-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # lets tests import the setup scripts
