# All settings in one place. Paths are relative to the project root,
# so the same file works on macOS, Windows and Linux CI.

paths:
  database: data/forecast.duckdb                 # real data, git-ignored
  fixture_database: tests/fixtures/fixture.duckdb # tiny invented data for tests and CI
  schema_doc: docs/schema.md                      # table and column descriptions the agent reads
  prompts_dir: prompts
  traces_dir: traces
  results_dir: results
  llm_cache_dir: .cache/llm

# Guardrails for the run_sql and sample_rows tools (Stage 1).
sql:
  max_rows: 200          # run_sql never returns more rows than this
  timeout_seconds: 10    # a query running longer than this is cancelled
  sample_rows: 5         # sample_rows returns at most this many rows
  # The only tables the agent may see or query. Everything else in the file
  # stays hidden: the raw and staging schemas, and ml.feat_daily_sales
  # (model input, large, would confuse the agent).
  allowed_tables:
    - marts.fct_daily_sales
    - marts.dim_date
    - marts.dim_item
    - marts.dim_store
    - serving.forecasts
    - ml.stockout_days
    - results.holdout_results   # added by scripts/load_holdout_results.py

# Limits for the agent loop (Stage 2).
agent:
  max_steps: 10          # maximum model calls per question
  # The agent exists in named variants, so an old one can always be run again
  # and compared. `variant` is the one the chat and the evaluation use by default.
  variant: v4
  variants:
    v1:   # the first agent, as measured in Stage 3
      system_prompt: prompts/system_v1.md
      submit_answer_tool: false   # final result = the last query that ran without error
    v2:   # Stage 4, change 1: the agent hands in its final query itself
      system_prompt: prompts/system_v2.md
      submit_answer_tool: true
    v3:   # Stage 4, change 2: v2 plus a check when the answer is handed in
      system_prompt: prompts/system_v2.md
      submit_answer_tool: true
      check_submission: true   # query required unless declining; multi-row results confirmed once
    v4:   # Stage 4, change 3: v3 with `sql` required in the tool schema and robust query matching
      system_prompt: prompts/system_v3.md
      submit_answer_tool: true
      check_submission: true
      submit_sql_required: true   # the schema requires `sql`; an empty string means "decline"
      sql_match: parsed           # compare queries by their parsed form, not by their text

# The language model.
llm:
  backend: anthropic     # anthropic | ollama (added in Stage 3)
  anthropic_model: claude-haiku-5-5   # cheapest current model; a stronger one is compared in Stage 3
  ollama_model: ""       # chosen in Stage 3: must support tool calling
  max_output_tokens: 16000   # upper limit for one model reply
  # Prompt caching: parts of a request that were sent recently are read from the
  # API's cache at a tenth of the input price. It does not change what the model sees.
  prompt_caching: true
  # Prices in US dollars per 1 million tokens (the API bills in dollars).
  # input/output: from the Anthropic price list, checked 2026-11-14.
  # cache_write (5-minute cache) and cache_read: checked 2026-11-16 on
  # platform.claude.com/docs/en/about-claude/pricing. The Haiku prices are for
  # prompts up to 100,000 tokens; ours are far smaller.
  prices_usd_per_million_tokens:
    claude-haiku-5-5: {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.10}

# Cost control for evaluation runs (Stage 3).
evaluation:
  # The runner stops when a run reaches this spend. Lowered to 0.20 on 2026-11-16:
  # about $0.99 is left in the account for the rest of the project. A new run of the
  # agent with claude-sonnet-5-5 costs about $3.35; cached runs are free.
  max_cost_per_run_usd: 0.20
  runs_per_setup: 3
