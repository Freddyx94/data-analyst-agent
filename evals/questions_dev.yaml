# --- data lookup: the stored value cannot be guessed from the schema ------------
# Event names are stored in their own spelling (Mother's day, PresidentsDay,
# Ramadan starts). A setup that cannot look at the data has to guess it.

- id: dev-31
  level: data_lookup
  question: How many units were sold on Mother's Day 2015?
  gold_sql: >
    SELECT sum(f.units_sold) AS units
    FROM marts.fct_daily_sales f JOIN marts.dim_date d ON f.date = d.date
    WHERE d.event_name = 'Mother''s day' AND d.year = 2015

- id: dev-32
  level: data_lookup
  question: How many units were sold during the NBA Finals in 2015, from the day they started to the day they ended?
  gold_sql: >
    SELECT sum(units_sold) AS units FROM marts.fct_daily_sales
    WHERE date BETWEEN (SELECT date FROM marts.dim_date WHERE event_name = 'NBAFinalsStart' AND year = 2015)
                   AND (SELECT date FROM marts.dim_date WHERE event_name = 'NBAFinalsEnd' AND year = 2015)
  notes: Both days are included.

- id: dev-33
  level: data_lookup
  question: What was the total revenue on Presidents' Day 2016?
  gold_sql: >
    SELECT sum(f.units_sold * f.sell_price) AS revenue
    FROM marts.fct_daily_sales f JOIN marts.dim_date d ON f.date = d.date
    WHERE d.event_name = 'PresidentsDay' AND d.year = 2016

- id: dev-34
  level: data_lookup
  question: How many units were sold on the day Ramadan started in 2014?
  gold_sql: >
