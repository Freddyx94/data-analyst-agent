# Runs on every push and pull request. Needs no API key and no real data:
# the tests use the fake model and the tiny fixture database.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q

  docker:
    # Builds the app image to check that the Dockerfile works. Nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t data-analyst-agent .
